name: release

on:
  push:
    branches:
      - beta
    #   - main

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions: 
      contents: read   

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      
      - name: Test
        run: deno task lint

  test:
    runs-on: ubuntu-latest
    permissions: 
      contents: read   

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      
      - name: Test
        run: deno task test

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release]
    if: ${{ needs.release.outputs.new_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x

      - name: publish
        run: deno publish --set-version=${{ needs.release.outputs.version }}
